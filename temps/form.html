<form 
  hx-post="XUrl" 
  hx-target="#XTarget" 
  hx-swap="innerHTML"
  hx-indicator="#loading-spinner"
  hx-on::after-request="if(event.detail.successful) this.reset()"
  class="space-y-5"
>
  XA
  <!-- Submit Button -->
  <button 
    type="submit" 
    class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition flex items-center justify-center gap-2"
  >
    <span>XB</span>
    
    <!-- htmx Loading Indicator -->
    <svg id="loading-spinner" class="htmx-indicator animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  </button>
</form>

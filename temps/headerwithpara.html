<main id="hero" class="relative overflow-hidden pt-12 pb-20 lg:pt-20 lg:pb-28 flex-grow">
        <!-- Background Ambient Orange Glow Blobs -->
        <div class="absolute -top-24 -left-20 w-96 h-96 bg-orange-400/20 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
        <div class="absolute top-1/2 -right-20 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="grid lg:grid-cols-12 gap-12 lg:gap-8 items-center">
                
                <!-- Left Content Column -->
                <div class="lg:col-span-7 text-center lg:text-left space-y-8">
                    
                    <!-- Sub-header Tagline Badge -->
                    <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-orange-100/80 border border-orange-200/80 text-orange-700 text-xs sm:text-sm font-semibold tracking-wide shadow-sm">
                        <span class="flex h-2 w-2 rounded-full bg-orange-500 animate-ping"></span>
                        <i class="fa-solid fa-bolt text-orange-500 text-xs"></i>
                        <span>XA</span>
                    </div>

                    <!-- Main Header -->
                    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-slate-900 leading-[1.15]">
                        XB <span class="relative inline-block text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-orange-600 to-amber-500">
                            XC
                            <!-- SVG Underline Decorator -->
                            <svg class="absolute left-0 -bottom-2 w-full h-3 text-orange-400/40 -z-10" viewBox="0 0 100 20" preserveAspectRatio="none">
                                <path d="M0 15 Q 50 0 100 15" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </h1>

                    <!-- Descriptive Paragraph -->
                    <p class="text-lg sm:text-xl text-slate-600 font-normal leading-relaxed max-w-2xl mx-auto lg:mx-0">
                        XD
                    </p>

                    <!-- Interactive Call To Action Buttons -->
                    <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-2">
                        <!-- XE Primary Button -->
                        <button id="more-info-btn" onclick="toggleModal(true)" class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 rounded-xl font-bold text-white bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 shadow-lg shadow-orange-500/30 hover:shadow-orange-500/50 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 group">
                            <span>XE</span>
                            <i class="fa-solid fa-arrow-right ml-3 group-hover:translate-x-1.5 transition-transform duration-200"></i>
                        </button>

                        <!-- Secondary Action Button -->
                        <a href="#demo" class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 rounded-xl font-semibold text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 shadow-sm hover:border-orange-200 hover:text-orange-600 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 group">
                            <i class="fa-solid fa-circle-play text-orange-500 mr-2 group-hover:scale-110 transition-transform"></i>
                            XF
                        </a>
                    </div>

                    <!-- Social Proof Micro-Section -->
                    <div class="pt-6 border-t border-slate-200/80 flex flex-wrap items-center justify-center lg:justify-start gap-6 text-sm text-slate-500">
                        <div class="flex items-center -space-x-2">
                            <img class="w-8 h-8 rounded-full border-2 border-white object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User Avatar 1">
                            <img class="w-8 h-8 rounded-full border-2 border-white object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=80" alt="User Avatar 2">
                            <img class="w-8 h-8 rounded-full border-2 border-white object-cover" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="User Avatar 3">
                            <span class="w-8 h-8 rounded-full border-2 border-white bg-orange-500 text-white font-bold text-xs flex items-center justify-center">XG</span>
                        </div>
                        <div>
                            <div class="flex text-amber-400 text-xs">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                            </div>
                            <span class="font-medium text-slate-700">XH</span> XI
                        </div>
                    </div>

                </div>

                <!-- Right Hero Image Column -->
                <div class="lg:col-span-5 relative flex justify-center">
                    
                    <!-- Main Showcase Container with Hover Glow -->
                    <div class="relative w-full max-w-lg lg:max-w-none group">
                        
                        <!-- Glow Backdrop behind Image -->
                        <div class="absolute -inset-1.5 bg-gradient-to-r from-orange-500 to-amber-500 rounded-3xl blur-xl opacity-40 group-hover:opacity-75 transition duration-500 group-hover:duration-200"></div>

                        <!-- Card Image Box -->
                        <div class="relative bg-white rounded-2xl p-3 shadow-2xl border border-slate-100 overflow-hidden">
                            <!-- Hero Graphic / Image -->
                            <div class="overflow-hidden rounded-xl bg-slate-900 aspect-4/3 relative">
                                <img id="hero-img" 
                                     src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80" 
                                     alt="Dashboard Preview Analytics" 
                                     class="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-700 ease-out"
                                     onerror="this.src='https://placehold.co/800x600/f97316/ffffff?text=Dashboard+Preview'">
                                
                                <!-- Subtle Image Overlay Gradient -->
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent"></div>
                            </div>

                            <!-- Floating Floating Metric Badge 1 (Top Right) -->
                            <div class="absolute top-6 right-6 bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-xl shadow-lg border border-slate-100 flex items-center space-x-3 animate-float">
                                <div class="w-8 h-8 rounded-lg bg-orange-100 flex items-center justify-center text-orange-600">
                                    <i class="fa-solid fa-chart-line text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-[10px] uppercase font-bold text-slate-400">XJ</p>
                                    <p class="text-sm font-extrabold text-slate-800">XK</p>
                                </div>
                            </div>

                            <!-- Floating Metric Badge 2 (Bottom Left) -->
                            <div class="absolute bottom-6 left-6 bg-white/90 backdrop-blur-md px-4 py-3 rounded-xl shadow-lg border border-slate-100 flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-slate-800">XL</p>
                                    <p class="text-[11px] text-slate-500">XM</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>
